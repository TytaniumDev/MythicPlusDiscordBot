name: Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  build-and-push:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        run: echo "IMAGE_NAME=$(echo ghcr.io/${GITHUB_REPOSITORY} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Connect to Tailscale
        id: tailscale
        continue-on-error: true
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-runner
      - name: Verify Tailscale connection
        run: |
          if [ "${{ steps.tailscale.outcome }}" != "success" ]; then
            echo "::error::============================================"
            echo "::error::TAILSCALE CONNECTION FAILED"
            echo "::error::============================================"
            echo "::error::The Tailscale OAuth credentials may be invalid!"
            echo "::error::"
            echo "::error::To fix this:"
            echo "::error::1. Go to Tailscale Admin Console → Settings → OAuth clients"
            echo "::error::2. Create/verify OAuth client with 'devices:write' scope"
            echo "::error::3. Ensure TS_OAUTH_CLIENT_ID and TS_OAUTH_SECRET are set in GitHub secrets"
            echo "::error::4. Verify ACLs allow tag:ci-runner"
            echo "::error::============================================"
            exit 1
          fi
          echo "Tailscale connected successfully"
          echo "Tailscale status:"
          tailscale status
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PI_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Add Pi to known hosts (get the host key)
          ssh-keyscan -H ${{ secrets.PI_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Test SSH connection
        run: |
          echo "Testing SSH connection to ${{ secrets.PI_HOST }}..."
          ssh -v -i ~/.ssh/deploy_key -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new \
            ${{ secrets.PI_USER }}@${{ secrets.PI_HOST }} "echo 'SSH connection successful!'"
      - name: Encode Firebase credentials
        id: firebase_b64
        run: |
          # Encode as single-line base64 so multiline JSON is not inlined in the deploy script
          # (inlining would break bash and can leak secrets in error messages)
          firebase_b64=$(echo "${{ secrets.FIREBASE_CREDENTIALS_JSON }}" | base64 -w0)
          echo "firebase_b64<<OUTPUT_EOF" >> $GITHUB_OUTPUT
          echo "$firebase_b64" >> $GITHUB_OUTPUT
          echo "OUTPUT_EOF" >> $GITHUB_OUTPUT
      - name: Deploy to Raspberry Pi
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=30 \
            ${{ secrets.PI_USER }}@${{ secrets.PI_HOST }} bash << DEPLOY_SCRIPT
            set -e
            echo "=== Deploy started ==="

            # Login to GHCR
            echo "Logging into GHCR..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            # Update repo
            cd ${{ secrets.PI_APP_DIR }}
            echo "Updating repo..."
            git fetch origin && git reset --hard origin/${{ github.ref_name }}

            # Set environment for docker compose (Firebase passed as base64 to avoid multiline/leak)
            export IMAGE_NAME=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')
            export IMAGE_TAG=${{ github.sha }}
            export BOT_TOKEN="${{ secrets.BOT_TOKEN }}"
            export DISCORD_APPLICATION_ID="${{ secrets.DISCORD_APPLICATION_ID }}"
            export GITHUB_TOKEN="${{ secrets.GH_ISSUE_TOKEN }}"
            FIREBASE_B64='${{ steps.firebase_b64.outputs.firebase_b64 }}'
            export FIREBASE_CREDENTIALS_JSON="\$(echo "\$FIREBASE_B64" | base64 -d)"

            # Deploy
            echo "Pulling image..."
            docker compose pull --quiet
            echo "Starting containers..."
            docker compose up -d --remove-orphans

            # Verify container is running
            echo "Verifying deployment..."
            docker compose ps

            # Cleanup
            docker image prune -f > /dev/null
            echo "=== Deploy finished ==="
          DEPLOY_SCRIPT
