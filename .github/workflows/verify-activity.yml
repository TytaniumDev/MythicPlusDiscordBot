name: Verify Activity

on:
  pull_request:
    paths:
      - 'activity/**'
      - 'packages/shared/**'
      - 'scripts/verify-activity.sh'
      - 'scripts/playwright-docker.sh'
      - '.github/workflows/verify-activity.yml'
  workflow_dispatch:

jobs:
  verify-activity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Check if last commit is automated snapshot update
        id: bot-check
        run: |
          AUTHOR=$(git log -1 --format='%an')
          MSG=$(git log -1 --format='%s')
          if [ "$AUTHOR" = "github-actions[bot]" ] && [[ "$MSG" == "chore: update visual test snapshots"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping — last commit was an automated snapshot update."
          fi

      - name: Setup Node
        if: steps.bot-check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        if: steps.bot-check.outputs.skip != 'true'
        run: npm ci

      - name: Typecheck and build
        if: steps.bot-check.outputs.skip != 'true'
        run: |
          cd activity
          npm run typecheck
          npm run build

      - name: Update snapshots (Docker)
        if: steps.bot-check.outputs.skip != 'true'
        run: ./scripts/playwright-docker.sh --update-snapshots=all

      - name: Commit updated snapshots
        id: snapshot-commit
        if: steps.bot-check.outputs.skip != 'true'
        run: |
          git add activity/tests/__screenshots__/
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update visual test snapshots"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Retrigger CI checks
        if: steps.snapshot-commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_REF: ${{ github.head_ref }}
        run: gh workflow run ci-retrigger.yml --ref "$BRANCH_REF"

      - name: Verify snapshots (Docker)
        if: steps.bot-check.outputs.skip != 'true'
        run: ./scripts/playwright-docker.sh
