name: Update Snapshots

# Regenerates Playwright visual snapshots in CI's own environment and commits
# them to the branch it runs on. Run it from the Actions tab ("Run workflow",
# pick your branch) when snapshots drift for reasons outside the UI code, such
# as a dependency bump.
#
# It pushes with the SNAPSHOTS_PUSH_TOKEN secret (a fine-grained token with
# Contents: write on this repo) when one is set. A push made with the
# workflow's own GITHUB_TOKEN leaves the PR's pull_request runs waiting for a
# maintainer's approval, and those pending runs keep auto-merge from firing.
# A push made with the token runs CI on the PR like any other push.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'changed = only rewrite snapshots that no longer match; all = rewrite every snapshot'
        type: choice
        options: [changed, all]
        default: changed

concurrency:
  group: update-snapshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-snapshots:
    if: github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    env:
      HAS_PUSH_TOKEN: ${{ secrets.SNAPSHOTS_PUSH_TOKEN != '' }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SNAPSHOTS_PUSH_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Same path as verify-activity.yml (typecheck, build, Storybook, then
      # Playwright in Docker) so snapshots are generated under exactly the
      # conditions they are verified in.
      - name: Update and verify snapshots (Docker)
        env:
          PW_UPDATE_MODE: ${{ inputs.mode }}
        run: ./scripts/verify-activity.sh --update-and-verify

      - name: Commit and push snapshots
        id: commit
        run: |
          git add activity/tests/__screenshots__
          if git diff --cached --quiet; then
            echo "Snapshots already up to date."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(activity): update visual snapshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Without SNAPSHOTS_PUSH_TOKEN the push was made with GITHUB_TOKEN, so the
      # PR's own runs wait for approval. Dispatch the checks so the new head
      # still reports them; the PR then needs its pending runs approved (or
      # another push) before auto-merge fires.
      - name: Re-run CI on the new commit
        if: steps.commit.outputs.pushed == 'true' && env.HAS_PUSH_TOKEN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci-retrigger.yml --ref "$GITHUB_REF_NAME"
          gh workflow run verify-activity.yml --ref "$GITHUB_REF_NAME"
