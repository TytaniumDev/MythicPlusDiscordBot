name: Send Issue to Jules
on:
  issues:
    types: [labeled] # Removed 'opened' to prevent a double-fire of events

# 1. Add this Concurrency block at the root level
concurrency:
  # Group runs by the specific workflow name AND the issue number.
  # This ensures that fixing Issue #5 doesn't block fixing Issue #6,
  # but two runs for Issue #5 will not overlap.
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  
  # If true, a new run immediately kills the currently running one.
  # If false, the new run waits in a queue until the current one finishes.
  # For a "fix" bot, 'true' is usually best to stop wasted work if a new request comes in.
  cancel-in-progress: true

jobs:
  dispatch-jules:
    # Strict Check: Only run if the *specific* label added in this event was 'jules'
    if: github.event.label.name == 'jules'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Call Jules API
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO_FULL_NAME: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # 1. Construct the Source ID (Standard format: sources/github/owner/repo)
          SOURCE_ID="sources/github/$REPO_FULL_NAME"

          # # 2. Construct the Prompt securely
          # # We combine the title and body to give Jules full context
