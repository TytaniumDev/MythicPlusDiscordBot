<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mythic+ Group Creator</title>
</head>
<body>
    <div id="app">
        <h1>Mythic+ Group Creator</h1>
        <div id="status-message" aria-live="polite" style="color: #f39c12; margin-bottom: 10px; min-height: 1.5em;"></div>

        <!-- Demo Mode Controls -->
        <div id="demo-controls" class="hidden" style="margin: 20px 0; text-align: center;">
            <button id="start-demo-btn" style="background-color: #2ecc71; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 1.2em;">Start Demo</button>
        </div>

        <!-- Lobby View -->
        <div id="lobby" class="hidden">
            <h2>Lobby</h2>
            <p>Waiting for players to join voice...</p>
            <ul id="player-list"></ul>
        </div>

        <!-- Wheel View -->
        <div id="wheel-container" class="hidden wheel-container">
            <div id="formed-groups-panel" class="formed-groups-panel hidden">
                <h3>Formed Groups</h3>
                <div id="formed-groups-list" aria-live="polite"></div>
            </div>
            <div id="tank-wrapper" class="wheel-wrapper">
                <div class="role-label">TANKS</div>
                <div class="arrow" aria-hidden="true"></div>
                <canvas id="wheel-tank" width="300" height="300" role="img" aria-label="Tank Selection Wheel"></canvas>
                <div id="result-tank" class="result" aria-live="polite" aria-atomic="true"></div>
            </div>
            <div id="healer-wrapper" class="wheel-wrapper">
                <div class="role-label">HEALERS</div>
                <div class="arrow" aria-hidden="true"></div>
                <canvas id="wheel-healer" width="300" height="300" role="img" aria-label="Healer Selection Wheel"></canvas>
                <div id="result-healer" class="result" aria-live="polite" aria-atomic="true"></div>
            </div>
            <div id="dps-wrapper" class="wheel-wrapper">
                <div class="role-label">DPS</div>
                <div class="arrow" aria-hidden="true"></div>
                <canvas id="wheel-dps" width="300" height="300" role="img" aria-label="DPS Selection Wheel"></canvas>
                <div id="result-dps" class="result" aria-live="polite" aria-atomic="true"></div>
            </div>
        </div>

        <!-- Results View -->
        <div id="results" class="hidden">
            <h2>Final Groups</h2>
            <div id="group-results"></div>
            <button id="new-round-btn" style="margin-top: 20px; background-color: #3498db;">Start New Round</button>
        </div>

        <!-- Controls -->
        <div id="controls">
            <button id="spin-btn" disabled>Loading...</button>
        </div>
    </div>
    <script type="module" src="/main.ts"></script>
</body>
</html>
