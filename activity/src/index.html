<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mythic+ Wheel | Gif or Gif</title>
</head>
<body>
    <div id="app">
        <header class="app-header">
            <h1>Wheelson</h1>
            <a id="commit-link" class="commit-hash" target="_blank" rel="noopener noreferrer"></a>
        </header>

        <div id="status-message" aria-live="polite"></div>

        <!-- Demo Mode Controls -->
        <div id="demo-controls" class="hidden">
            <button id="start-demo-btn" class="btn btn-success">Start Demo</button>
        </div>

        <button id="start-session-btn" class="btn btn-primary btn-large hidden">Start Session</button>

        <div class="main-layout">
            <main class="content-area">
                <!-- View: Channel Picker -->
                <section id="view-channels" class="view hidden">
                    <h2>Select a Voice Channel</h2>
                    <div id="channel-list"></div>
                </section>

                <!-- View: Lobby -->
                <section id="view-lobby" class="view hidden">
                    <div class="lobby-header">
                        <button id="change-channel-btn" class="btn btn-back" aria-label="Change voice channel">&larr;</button>
                        <h2>Players</h2>
                        <span id="player-count" class="player-count"></span>
                    </div>
                    <div id="player-list"></div>
                    <button id="spin-btn" class="btn btn-primary btn-large" disabled>Loading...</button>
                </section>

                <!-- View: Wheels -->
                <section id="view-wheels" class="view hidden">
                    <div id="wheel-status" class="wheel-status"></div>

                    <div class="wheels-content">
                        <div class="wheels-area">
                            <div class="wheels-container" style="--carousel-index: 0;">
                                <div class="wheel-slot" id="slot-tank">
                                    <span class="wheel-label label-tank">Tank</span>
                                    <div class="wheel-frame">
                                        <div class="wheel-pointer"></div>
                                        <canvas id="wheel-tank" aria-label="Tank Selection Wheel"></canvas>
                                    </div>
                                    <div id="result-tank" class="wheel-result" aria-live="polite"></div>
                                </div>
                                <div class="wheel-slot" id="slot-healer">
                                    <span class="wheel-label label-healer">Healer</span>
                                    <div class="wheel-frame">
                                        <div class="wheel-pointer"></div>
                                        <canvas id="wheel-healer" aria-label="Healer Selection Wheel"></canvas>
                                    </div>
                                    <div id="result-healer" class="wheel-result" aria-live="polite"></div>
                                </div>
                                <div class="wheel-slot" id="slot-dps1">
                                    <span class="wheel-label label-dps">DPS</span>
                                    <div class="wheel-frame">
                                        <div class="wheel-pointer"></div>
                                        <canvas id="wheel-dps1" aria-label="DPS Selection Wheel 1"></canvas>
                                    </div>
                                    <div id="result-dps1" class="wheel-result" aria-live="polite"></div>
                                </div>
                                <div class="wheel-slot" id="slot-dps2">
                                    <span class="wheel-label label-dps">DPS</span>
                                    <div class="wheel-frame">
                                        <div class="wheel-pointer"></div>
                                        <canvas id="wheel-dps2" aria-label="DPS Selection Wheel 2"></canvas>
                                    </div>
                                    <div id="result-dps2" class="wheel-result" aria-live="polite"></div>
                                </div>
                                <div class="wheel-slot" id="slot-dps3">
                                    <span class="wheel-label label-dps">DPS</span>
                                    <div class="wheel-frame">
                                        <div class="wheel-pointer"></div>
                                        <canvas id="wheel-dps3" aria-label="DPS Selection Wheel 3"></canvas>
                                    </div>
                                    <div id="result-dps3" class="wheel-result" aria-live="polite"></div>
                                </div>
                            </div>

                            <div class="carousel-dots" aria-label="Wheel navigation">
                                <button class="carousel-dot active" data-index="0" aria-label="Tank wheel" style="--dot-color: var(--color-tank);" aria-current="step"></button>
                                <button class="carousel-dot" data-index="1" aria-label="Healer wheel" style="--dot-color: var(--color-healer);"></button>
                                <button class="carousel-dot" data-index="2" aria-label="DPS 1 wheel" style="--dot-color: var(--color-dps);"></button>
                                <button class="carousel-dot" data-index="3" aria-label="DPS 2 wheel" style="--dot-color: var(--color-dps);"></button>
                                <button class="carousel-dot" data-index="4" aria-label="DPS 3 wheel" style="--dot-color: var(--color-dps);"></button>
                            </div>
                        </div>

                        <!-- Side Panel: Formed Groups (inside wheels view for layout) -->
                        <aside id="side-panel" class="side-panel hidden">
                            <h3>Groups</h3>
                            <div id="groups-list"></div>
                        </aside>
                    </div>

                    <button id="next-btn" class="btn btn-primary btn-large">Spin for Group 1</button>
                </section>

                <!-- View: Results -->
                <section id="view-results" class="view hidden">
                    <h2>All Groups Formed!</h2>
                    <div id="final-groups"></div>
                    <button id="new-round-btn" class="btn btn-secondary btn-large">New Round</button>
                </section>
            </main>
        </div>
    </div>
    <script type="module" src="/main.ts"></script>
</body>
</html>
