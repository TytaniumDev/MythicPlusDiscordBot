name: Deploy

# One workflow deploys everything a merge to main changes: Firebase (rules,
# indexes, functions), Discord's application commands, and the activity on
# GitHub Pages. Every deploy job waits on one CI run against the merged commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Workflow-level, never cancelled: an older merge's deploy can't finish after
# a newer one's and leave production on the older commit.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    # A manual run from any other branch deploys nothing: every deploy job
    # needs this one, so they're skipped with it.
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci-shared.yml

  deploy-firebase:
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Load Doppler secrets
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          DELIM=$(openssl rand -hex 16)
          SECRETS=$(doppler secrets download --no-file --format json)
          KEYS='["FIREBASE_CREDENTIALS_JSON"]'
          echo "$SECRETS" | jq -r --argjson keys "$KEYS" '
            to_entries[] | select(.key | IN($keys[])) | .value
          ' | while IFS= read -r val; do
            [ -n "$val" ] && echo "::add-mask::$val"
          done
          echo "$SECRETS" | jq -r --argjson keys "$KEYS" --arg d "$DELIM" '
            to_entries[] | select(.key | IN($keys[])) | "\(.key)<<\($d)\n\(.value)\n\($d)"
          ' >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build functions
        run: |
          # Bundles src/ into dist/index.js with @mythicplus/shared inlined, so
          # Cloud Build only has to install the runtime dependencies.
          npm -w packages/functions run build

          # Cloud Build runs a lockfile-less `npm install` in packages/functions.
          # The devDependencies aren't needed at runtime: @mythicplus/shared is
          # a workspace package that isn't on npm, and vitest 4 crashes that
          # install ("Cannot read properties of null (reading 'edgesOut')").
          jq 'del(.devDependencies)' packages/functions/package.json > "$RUNNER_TEMP/fn-pkg.json" \
            && mv "$RUNNER_TEMP/fn-pkg.json" packages/functions/package.json

      - name: Deploy Firestore rules, TTL policies and Cloud Functions
        run: |
          echo "$FIREBASE_CREDENTIALS_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"

          # firestore:indexes also applies the TTL policies in the
          # fieldOverrides of firestore.indexes.json.
          npx firebase-tools@14 deploy --only firestore:rules,firestore:indexes,functions --non-interactive --force

      - name: Clean up credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/firebase-sa.json"

  register-commands:
    # Discord's command list is replaced on every deploy: /bug and
    # /featurerequest, which the discordInteractions function answers, plus
    # the activity's Entry Point command (packages/functions/src/applicationCommands.ts).
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Load Doppler secrets
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          DELIM=$(openssl rand -hex 16)
          SECRETS=$(doppler secrets download --no-file --format json)
          KEYS='["BOT_TOKEN","DISCORD_APPLICATION_ID"]'
          # Mask each secret value so it cannot appear in workflow logs
          echo "$SECRETS" | jq -r --argjson keys "$KEYS" '
            to_entries[] | select(.key | IN($keys[])) | .value
          ' | while IFS= read -r val; do
            [ -n "$val" ] && echo "::add-mask::$val"
          done
          echo "$SECRETS" | jq -r --argjson keys "$KEYS" --arg d "$DELIM" '
            to_entries[] | select(.key | IN($keys[])) | "\(.key)<<\($d)\n\(.value)\n\($d)"
          ' >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Register application commands
        run: npm -w packages/functions run register-commands

  deploy-pages:
    needs: [ci]
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Load Doppler secrets
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          DELIM=$(openssl rand -hex 16)
          SECRETS=$(doppler secrets download --no-file --format json)
          # Mask each secret value so it cannot appear in workflow logs
          echo "$SECRETS" | jq -r '
            to_entries[]
            | select(.key == "DISCORD_APPLICATION_ID" or .key == "VITE_SENTRY_DSN" or .key == "SENTRY_AUTH_TOKEN" or (.key | startswith("VITE_FIREBASE_")))
            | .value
          ' | while IFS= read -r val; do
            [ -n "$val" ] && echo "::add-mask::$val"
          done
          # Export filtered secrets
          echo "$SECRETS" | jq -r --arg d "$DELIM" '
            to_entries[]
            | select(.key == "DISCORD_APPLICATION_ID" or .key == "VITE_SENTRY_DSN" or .key == "SENTRY_AUTH_TOKEN" or (.key | startswith("VITE_FIREBASE_")))
            | "\(.key)<<\($d)\n\(.value)\n\($d)"
          ' >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Activity
        env:
          VITE_DISCORD_CLIENT_ID: ${{ env.DISCORD_APPLICATION_ID }}
          VITE_SENTRY_DSN: ${{ env.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ env.SENTRY_AUTH_TOKEN }}
        run: |
          cd activity
          npm run build

      - name: Build Storybook
        run: npm -w activity run build-storybook -- -o dist/storybook

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'activity/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
