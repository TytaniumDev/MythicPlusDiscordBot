<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mythic+ Wheel | Gif or Gif</title>
</head>
<body>
    <div id="app">
        <header class="app-header">
            <h1 role="button" tabindex="0" aria-label="Return home or to lobby">Wheelson</h1>
            <a id="commit-link" class="commit-hash" target="_blank" rel="noopener noreferrer"></a>
        </header>

        <div id="status-message" aria-live="polite"></div>

        <!-- Demo Mode Controls -->
        <div id="demo-controls" class="hidden">
            <button id="start-demo-btn" class="btn btn-success">Start Demo</button>
        </div>

        <button id="start-session-btn" class="btn btn-primary btn-large hidden">Start Session</button>

        <div class="main-layout">
            <main class="content-area">
                <!-- View: Home (Recent Guilds) -->
                <section id="view-home" class="view hidden">
                    <h2>Recent Guilds</h2>
                    <div id="recent-guilds-list"></div>
                    <p id="no-recent-guilds" class="empty-message hidden">
                        No recent guilds. Use a direct link or start from Discord to begin.
                    </p>
                </section>

                <!-- View: Channel Picker -->
                <section id="view-channels" class="view hidden">
                    <h2>Select a Voice Channel</h2>
                    <button id="refresh-channels-btn" class="btn btn-secondary btn-refresh" aria-label="Refresh channel list">Refresh channels</button>
                    <div id="channel-list"></div>
                </section>

                <!-- View: Lobby -->
                <section id="view-lobby" class="view hidden">
                    <div class="lobby-header">
                        <button id="change-channel-btn" class="btn btn-back" aria-label="Change voice channel"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></button>
                        <div class="lobby-header-center">
                            <h2>Players</h2>
                            <span id="player-count" class="player-count"></span>
                        </div>
                        <div class="lobby-header-spacer" aria-hidden="true"></div>
                    </div>
                    <div id="player-list"></div>
                    <button id="spin-btn" class="btn btn-primary btn-large" disabled>Loading...</button>
                </section>

                <!-- View: Wheels -->
                <section id="view-wheels" class="view hidden">
                    <div class="wheels-header">
                        <button id="wheels-back-btn" class="btn btn-back" aria-label="Back to lobby"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></button>
                        <div id="wheel-status" class="wheel-status"></div>
                        <div class="wheels-header-spacer" aria-hidden="true"></div>
                    </div>

                    <div class="wheels-content">
                        <!-- Wheels area: dynamically populated by WheelsGrid -->
                        <div id="wheels-area" class="wheels-content-area"></div>

                        <!-- Side Panel: Formed Groups + Announce toggle -->
                        <div id="side-column" class="side-column hidden">
                            <aside id="side-panel" class="side-panel">
                                <h3>Groups</h3>
                                <div id="groups-list"></div>
                            </aside>
                            <label class="announce-option">
                                <input type="checkbox" id="announce-checkbox" checked>
                                <span>Post results to chat</span>
                            </label>
                        </div>
                    </div>
                    <button id="next-btn" class="btn btn-primary btn-large">Spin for Group 1</button>
                </section>

                <!-- View: Results -->
                <section id="view-results" class="view hidden">
                    <h2>All Groups Formed!</h2>
                    <div id="final-groups"></div>
                    <button id="new-round-btn" class="btn btn-secondary btn-large">New Round</button>
                </section>
            </main>
        </div>
    </div>
    <script type="module" src="/main.ts"></script>
</body>
</html>
