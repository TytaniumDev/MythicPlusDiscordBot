name: CI Shared

on:
  workflow_call:

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Cache luarocks
        uses: actions/cache@v4
        with:
          path: ~/.luarocks
          key: luarocks-luacheck-${{ runner.os }}
      - name: Install luacheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 luarocks
          luarocks install --local luacheck
          echo "$HOME/.luarocks/bin" >> $GITHUB_PATH
      - name: Lint addon (luacheck)
        run: cd addon && luacheck src/ tests/

  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx -w packages/shared tsc --noEmit
      - run: npx -w packages/bot tsc --noEmit

  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm -w packages/bot run test
      - name: Cache luarocks
        uses: actions/cache@v4
        with:
          path: ~/.luarocks
          key: luarocks-busted-${{ runner.os }}
      - name: Install busted
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 luarocks
          luarocks install --local busted
          echo "$HOME/.luarocks/bin" >> $GITHUB_PATH
      - name: Test addon (busted)
        run: cd addon && busted
