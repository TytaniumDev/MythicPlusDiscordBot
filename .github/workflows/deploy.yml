name: Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci-shared.yml

  deploy-firebase:
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Load Doppler secrets
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: ./scripts/doppler-deploy-firebase.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: ./setup.sh --skip-verify

      - name: Build shared + functions
        run: ./scripts/build-firebase.sh

      - name: Deploy Firestore rules and Cloud Functions
        run: ./scripts/deploy-firebase.sh

      - name: Clean up credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/firebase-sa.json"
          rm -f packages/functions/.env

  build-and-push:
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        run: echo "IMAGE_NAME=$(echo ghcr.io/${GITHUB_REPOSITORY} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 20
    steps:
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Load Doppler secrets
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: ./scripts/doppler-deploy.sh

      - name: Connect to Tailscale
        id: tailscale
        continue-on-error: true
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci-runner
      - name: Verify Tailscale connection
        env:
          TAILSCALE_OUTCOME: ${{ steps.tailscale.outcome }}
        run: ./scripts/verify-tailscale.sh
      - name: Setup SSH key
        run: ./scripts/setup-ssh.sh
      - name: Test SSH connection
        run: |
          echo "Testing SSH connection to $PI_HOST..."
          ssh -v -i ~/.ssh/deploy_key -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new \
            "$PI_USER@$PI_HOST" "echo 'SSH connection successful!'"
      - name: Encode Firebase credentials
        id: firebase_b64
        run: ./scripts/encode-firebase.sh
      - name: Deploy to Raspberry Pi
        env:
          GH_ISSUE_TOKEN: ${{ env.GH_ISSUE_TOKEN }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          FIREBASE_B64_INPUT: ${{ steps.firebase_b64.outputs.firebase_b64 }}
        run: ./scripts/deploy-pi.sh
