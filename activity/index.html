<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mythic+ Group Picker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Mythic+ Group Picker</h1>

        <div class="controls-area">
            <button id="prev-btn" class="nav-btn hidden">&lt;</button>
            <h2 id="group-indicator">Group 1</h2>
            <button id="next-btn" class="nav-btn hidden">&gt;</button>
        </div>

        <div class="wheels-row">
            <!-- Tank Wheel -->
            <div class="wheel-wrapper" id="tank-wrapper">
                <h3>Tank</h3>
                <div class="canvas-container">
                    <canvas id="wheel-tank" width="300" height="300"></canvas>
                    <div class="pointer"></div>
                </div>
                <div class="result-text" id="result-tank"></div>
            </div>

            <!-- Healer Wheel -->
            <div class="wheel-wrapper" id="healer-wrapper">
                <h3>Healer</h3>
                <div class="canvas-container">
                    <canvas id="wheel-healer" width="300" height="300"></canvas>
                    <div class="pointer"></div>
                </div>
                <div class="result-text" id="result-healer"></div>
            </div>

            <!-- DPS Wheel -->
            <div class="wheel-wrapper" id="dps-wrapper">
                <h3>DPS</h3>
                <div class="canvas-container">
                    <canvas id="wheel-dps" width="300" height="300"></canvas>
                    <div class="pointer"></div>
                </div>
                <div class="result-text" id="result-dps"></div>
            </div>
        </div>

        <button id="spin-btn" class="action-btn">SPIN GROUP!</button>
        <div id="status-message"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
