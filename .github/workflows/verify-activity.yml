name: Verify Activity

on:
  pull_request:
    paths:
      - 'activity/**'
      - 'packages/shared/**'
      - 'scripts/verify-activity.sh'
      - 'scripts/playwright-docker.sh'
      - '.github/workflows/verify-activity.yml'
  workflow_dispatch:

jobs:
  verify-activity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: |
          cd activity
          npm run typecheck
          npm run build

      - name: Update snapshots (Docker)
        run: ./scripts/playwright-docker.sh --update-snapshots=all

      - name: Commit updated snapshots
        run: |
          git add activity/tests/__screenshots__/
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update visual test snapshots [skip ci]"
            git push
          fi

      - name: Verify snapshots (Docker)
        run: ./scripts/playwright-docker.sh
