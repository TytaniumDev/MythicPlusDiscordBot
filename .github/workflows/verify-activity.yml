name: Verify Activity

on:
  pull_request:
    paths:
      - 'activity/**'
      - 'packages/shared/**'
      - 'scripts/verify-activity.sh'
      - 'scripts/playwright-docker.sh'
      - '.github/workflows/verify-activity.yml'
  workflow_dispatch:

jobs:
  verify-activity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      snapshot-pushed: ${{ steps.snapshot-commit.outputs.pushed }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Check if last commit is automated snapshot update
        id: bot-check
        run: ./scripts/bot-check.sh

      - name: Setup Node
        if: steps.bot-check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        if: steps.bot-check.outputs.skip != 'true'
        run: npm ci

      - name: Update snapshots (Docker)
        if: steps.bot-check.outputs.skip != 'true'
        run: ./scripts/verify-activity.sh --update-snapshots

      - name: Commit updated snapshots
        id: snapshot-commit
        if: steps.bot-check.outputs.skip != 'true'
        run: ./scripts/commit-snapshots.sh

      - name: Verify snapshots (Docker)
        if: steps.bot-check.outputs.skip != 'true'
        run: ./scripts/verify-activity.sh

  # When the bot pushes snapshot updates, the new commit won't get
  # pull_request-triggered CI checks (GitHub Actions pushes don't fire
  # PR events). Run CI inline so branch protection required checks
  # (CI / Lint, CI / Build, CI / Test) are satisfied on the new SHA.
  CI:
    needs: verify-activity
    if: needs.verify-activity.outputs.snapshot-pushed == 'true'
    uses: ./.github/workflows/ci-shared.yml
