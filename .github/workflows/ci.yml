name: CI

on:
  pull_request:
    branches: [main, master]
  workflow_call:

jobs:
  verify-ts:
    name: TypeScript Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ./scripts/verify-ts.sh
