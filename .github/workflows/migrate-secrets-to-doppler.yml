name: Migrate Secrets to Doppler
on:
  workflow_dispatch: # Manual trigger only

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Push secrets to Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
          PI_APP_DIR: ${{ secrets.PI_APP_DIR }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GH_ISSUE_TOKEN: ${{ secrets.GH_ISSUE_TOKEN }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
        run: |
          doppler secrets set \
            BOT_TOKEN="${BOT_TOKEN}" \
            DISCORD_APPLICATION_ID="${DISCORD_APPLICATION_ID}" \
            FIREBASE_CREDENTIALS_JSON="${FIREBASE_CREDENTIALS_JSON}" \
            SENTRY_DSN="${SENTRY_DSN}" \
            VITE_FIREBASE_API_KEY="${VITE_FIREBASE_API_KEY}" \
            VITE_FIREBASE_AUTH_DOMAIN="${VITE_FIREBASE_AUTH_DOMAIN}" \
            VITE_FIREBASE_PROJECT_ID="${VITE_FIREBASE_PROJECT_ID}" \
            VITE_FIREBASE_STORAGE_BUCKET="${VITE_FIREBASE_STORAGE_BUCKET}" \
            VITE_FIREBASE_MESSAGING_SENDER_ID="${VITE_FIREBASE_MESSAGING_SENDER_ID}" \
            VITE_FIREBASE_APP_ID="${VITE_FIREBASE_APP_ID}" \
            PI_HOST="${PI_HOST}" \
            PI_USER="${PI_USER}" \
            PI_APP_DIR="${PI_APP_DIR}" \
            GHCR_TOKEN="${GHCR_TOKEN}" \
            GH_ISSUE_TOKEN="${GH_ISSUE_TOKEN}" \
            TS_OAUTH_CLIENT_ID="${TS_OAUTH_CLIENT_ID}" \
            TS_OAUTH_SECRET="${TS_OAUTH_SECRET}" \
            PI_SSH_KEY="${PI_SSH_KEY}" \
            --no-interactive
          echo "Migration complete."
