name: Verify Backend

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'core/**'
      - 'cogs/**'
      - 'tests/**'
      - 'scripts/**'
      - '*.py'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_call:

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Verification
        run: ./scripts/verify.sh
        env:
          CI: true
