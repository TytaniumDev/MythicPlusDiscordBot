name: CI and Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        run: echo "IMAGE_NAME=$(echo ghcr.io/${GITHUB_REPOSITORY} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    timeout-minutes: 20
    steps:
      - name: Connect to Tailscale
        id: tailscale
        continue-on-error: true
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gha-deploy-bot
      - name: Verify Tailscale connection
        run: |
          if [ "${{ steps.tailscale.outcome }}" != "success" ]; then
            echo "::error::============================================"
            echo "::error::TAILSCALE CONNECTION FAILED"
            echo "::error::============================================"
            echo "::error::The Tailscale auth key (TS_AUTHKEY) may be expired!"
            echo "::error::Auth keys expire after 90 days."
            echo "::error::"
            echo "::error::To fix this:"
            echo "::error::1. Go to Tailscale Admin Console → Settings → Keys"
            echo "::error::2. Generate a new auth key (Reusable + Ephemeral)"
            echo "::error::3. Update the TS_AUTHKEY secret in GitHub repository settings"
            echo "::error::============================================"
            exit 1
          fi
          echo "Tailscale connected successfully"
      - name: Deploy to Raspberry Pi
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          port: ${{ secrets.PI_SSH_PORT != '' && secrets.PI_SSH_PORT || 22 }}
          timeout: 2m
          command_timeout: 15m
          script: |
            set -e
            echo "[$(date -Iseconds)] === Deploy started ==="
            IMAGE_NAME=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')
            IMAGE_TAG=${{ github.sha }}
            echo "[$(date -Iseconds)] Image: $IMAGE_NAME:$IMAGE_TAG"
            echo "[$(date -Iseconds)] Docker login to ghcr.io..."
            docker login ghcr.io -u ${{ github.repository_owner }} -p ${{ secrets.GHCR_TOKEN }}
            echo "[$(date -Iseconds)] Docker login done."
            export BOT_TOKEN="${{ secrets.BOT_TOKEN }}"
            export DISCORD_APPLICATION_ID="${{ secrets.DISCORD_APPLICATION_ID }}"
            echo "[$(date -Iseconds)] cd to app dir: ${{ secrets.PI_APP_DIR }}"
            cd ${{ secrets.PI_APP_DIR }}
            BRANCH="${{ github.ref_name }}"
            echo "[$(date -Iseconds)] Git fetch origin..."
            git fetch origin
            echo "[$(date -Iseconds)] Git fetch done. Resetting to origin/${BRANCH}..."
            git reset --hard "origin/${BRANCH}"
            echo "[$(date -Iseconds)] Git reset done."
            export IMAGE_NAME
            export IMAGE_TAG
            echo "[$(date -Iseconds)] Docker compose pull..."
            docker compose pull
            echo "[$(date -Iseconds)] Docker compose pull done. Bringing up containers..."
            docker compose up -d --remove-orphans
            echo "[$(date -Iseconds)] Containers up. Checking bot container..."
            container_id=$(docker compose ps -q bot)
            if [ -z "$container_id" ]; then
              echo "Bot container not found."
              exit 1
            fi
            echo "[$(date -Iseconds)] Bot container id: $container_id. Waiting for healthy/running (up to 60s)..."
            for i in $(seq 1 12); do
              health=$(docker inspect -f '${{ '{{' }}if .State.Health}}${{ '}}' }}${{ '{{' }}.State.Health.Status}}${{ '}}' }}${{ '{{' }}else}}none${{ '}}' }}${{ '{{' }}end}}${{ '}}' }}' "$container_id")
              status=$(docker inspect -f '${{ '{{' }}.State.Status}}${{ '}}' }}' "$container_id")
              echo "[$(date -Iseconds)]   attempt $i/12: health=$health status=$status"
              if [ "$health" = "healthy" ] || { [ "$health" = "none" ] && [ "$status" = "running" ]; }; then
                echo "Container healthy/running."
                break
              fi
              if [ "$health" = "unhealthy" ] || [ "$status" != "running" ]; then
                echo "Container unhealthy or stopped."
                break
              fi
              sleep 5
            done
            if [ "$health" = "unhealthy" ] || [ "$status" != "running" ]; then
              echo "[$(date -Iseconds)] Restarting bot container..."
              docker compose restart bot
              sleep 5
              container_id=$(docker compose ps -q bot)
              health=$(docker inspect -f '${{ '{{' }}if .State.Health}}${{ '}}' }}${{ '{{' }}.State.Health.Status}}${{ '}}' }}${{ '{{' }}else}}none${{ '}}' }}${{ '{{' }}end}}${{ '}}' }}' "$container_id")
              status=$(docker inspect -f '${{ '{{' }}.State.Status}}${{ '}}' }}' "$container_id")
              if [ "$health" = "unhealthy" ] || [ "$status" != "running" ]; then
                echo "Container still unhealthy or stopped."
                exit 1
              fi
            fi
            echo "[$(date -Iseconds)] Pruning unused images..."
            docker image prune -f
            echo "[$(date -Iseconds)] === Deploy finished ==="
