name: CI and Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        run: echo "IMAGE_NAME=$(echo ghcr.io/${GITHUB_REPOSITORY} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    timeout-minutes: 20
    steps:
      - name: Connect to Tailscale
        id: tailscale
        continue-on-error: true
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gha-deploy-bot
      - name: Verify Tailscale connection
        run: |
          if [ "${{ steps.tailscale.outcome }}" != "success" ]; then
            echo "::error::============================================"
            echo "::error::TAILSCALE CONNECTION FAILED"
            echo "::error::============================================"
            echo "::error::The Tailscale auth key (TS_AUTHKEY) may be expired!"
            echo "::error::Auth keys expire after 90 days."
            echo "::error::"
            echo "::error::To fix this:"
            echo "::error::1. Go to Tailscale Admin Console → Settings → Keys"
            echo "::error::2. Generate a new auth key (Reusable + Ephemeral)"
            echo "::error::3. Update the TS_AUTHKEY secret in GitHub repository settings"
            echo "::error::============================================"
            exit 1
          fi
          echo "Tailscale connected successfully"
      - name: Deploy to Raspberry Pi
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          port: ${{ secrets.PI_SSH_PORT != '' && secrets.PI_SSH_PORT || 22 }}
          timeout: 2m
          command_timeout: 10m
          debug: true
          script: |
            set -e
            echo "=== Deploy started ==="

            # Set up variables
            export IMAGE_NAME=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')
            export IMAGE_TAG=${{ github.sha }}
            export BOT_TOKEN="${{ secrets.BOT_TOKEN }}"
            export DISCORD_APPLICATION_ID="${{ secrets.DISCORD_APPLICATION_ID }}"

            # Login to GHCR
            echo "Logging into GHCR..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            # Update repo
            cd ${{ secrets.PI_APP_DIR }}
            echo "Updating repo..."
            git fetch origin && git reset --hard origin/${{ github.ref_name }}

            # Deploy
            echo "Pulling image..."
            docker compose pull --quiet
            echo "Starting containers..."
            docker compose up -d --remove-orphans --quiet

            # Verify container is running
            echo "Verifying deployment..."
            docker compose ps

            # Cleanup
            docker image prune -f > /dev/null
            echo "=== Deploy finished ==="
