name: Verify Activity

on:
  pull_request:
    paths:
      - 'activity/**'
      - 'scripts/verify-activity.sh'
      - '.github/workflows/verify-activity.yml'
  workflow_dispatch:

jobs:
  verify-activity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'activity/package-lock.json'

      - name: Run Activity Verification
        run: ./scripts/verify-activity.sh
        env:
          CI: true
