[project]
name = "mythic-plus-discord-bot"
version = "0.1.0"
description = "Discord bot for Mythic+ group finding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp==3.9.5",
    "aiosignal==1.3.1",
    "attrs==23.2.0",
    "discord-py>=2.4.0",
    "firebase-admin==6.6.0",
    "frozenlist==1.4.1",
    "idna==3.7",
    "multidict==6.0.5",
    "pillow>=10.3.0",
    "pynacl==1.5.0",
    "python-dotenv==1.0.1",
    "requests==2.31.0",
    "yarl==1.9.4",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["."]
exclude = [".git", ".venv", "__pycache__", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (Ruff format handles this)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["activity"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingImports = false
reportUnusedVariable = true
reportUnusedImport = true

# Enabled checks (fixed via code changes or type: ignore comments where needed)
reportConstantRedefinition = true
reportPrivateUsage = true
reportMissingParameterType = true
reportOptionalMemberAccess = true
reportUnknownParameterType = true

# Disabled: discord.py has incomplete stubs causing "Unknown" types to propagate
# These checks produce many false positives that would require extensive workarounds
reportAttributeAccessIssue = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[dependency-groups]
dev = [
    "aiohttp==3.9.5",
    "aiosignal==1.3.1",
    "attrs==23.2.0",
    "coverage>=7.13.4",
    "discord-py>=2.4.0",
    "firebase-admin==6.6.0",
    "frozenlist==1.4.1",
    "idna==3.7",
    "multidict==6.0.5",
    "pillow>=10.3.0",
    "pre-commit>=3.0.0",
    "pynacl==1.5.0",
    "pyright>=1.1.0",
    "pytest>=9.0.2",
    "python-dotenv==1.0.1",
    "requests==2.31.0",
    "ruff>=0.8.0",
    "yarl==1.9.4",
]
