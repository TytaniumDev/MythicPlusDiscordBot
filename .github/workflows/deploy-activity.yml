name: Deploy Activity to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Load Doppler secrets
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          DELIM=$(openssl rand -hex 16)
          SECRETS=$(doppler secrets download --no-file --format json)
          # Mask each secret value so it cannot appear in workflow logs
          echo "$SECRETS" | jq -r '
            to_entries[]
            | select(.key == "DISCORD_APPLICATION_ID" or (.key | startswith("VITE_FIREBASE_")))
            | .value
          ' | while IFS= read -r val; do
            [ -n "$val" ] && echo "::add-mask::$val"
          done
          # Export filtered secrets
          echo "$SECRETS" | jq -r --arg d "$DELIM" '
            to_entries[]
            | select(.key == "DISCORD_APPLICATION_ID" or (.key | startswith("VITE_FIREBASE_")))
            | "\(.key)<<\($d)\n\(.value)\n\($d)"
          ' >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          cd activity
          npm ci

      - name: Build Activity
        env:
          VITE_DISCORD_CLIENT_ID: ${{ env.DISCORD_APPLICATION_ID }}
        run: |
          cd activity
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'activity/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
