services:
  bot:
    image: ${IMAGE_NAME:-mythic-plus-bot}:${IMAGE_TAG:-latest}
    build: .
    container_name: mythic-plus-bot
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - DISCORD_APPLICATION_ID=${DISCORD_APPLICATION_ID}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - FIREBASE_CREDENTIALS_JSON=${FIREBASE_CREDENTIALS_JSON}
    healthcheck:
      # The bot touches this file every 30s while connected to Discord
      # (packages/bot/src/core/heartbeat.ts); older than 90s means it isn't.
      test: ["CMD", "node", "-e", "process.exit(Date.now() - require('fs').statSync('/tmp/mythic-bot-heartbeat').mtimeMs < 90000 ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
