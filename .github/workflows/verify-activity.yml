name: Verify Activity

on:
  pull_request:
    paths:
      - 'activity/**'
      - 'packages/shared/**'
      - 'scripts/verify-activity.sh'
      - 'scripts/playwright-docker.sh'
      - '.github/workflows/verify-activity.yml'
  workflow_dispatch:

jobs:
  verify-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Activity (typecheck, build, Storybook, Playwright)
        run: ./scripts/verify-activity.sh --update-and-verify

      - name: Auto-commit updated snapshots
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet activity/tests/__screenshots__/; then
            echo "All snapshots are up-to-date."
            exit 0
          fi
          echo "Snapshots changed — committing updates..."
          git diff --name-only activity/tests/__screenshots__/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add activity/tests/__screenshots__/
          git commit -m "chore: update visual snapshots [skip ci]"
          git push origin "HEAD:$HEAD_REF"
