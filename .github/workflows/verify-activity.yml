name: Verify Activity

# Runs on every PR so `verify-activity` can be a required check: a required
# check that a path filter skips stays pending forever. PRs that touch nothing
# the activity build or screenshots depend on pass after the change check.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-activity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for activity changes
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA"...HEAD \
            | grep -qE '^(activity/|packages/shared/|package\.json$|package-lock\.json$|scripts/(verify-activity|playwright-docker)\.sh$|\.github/workflows/verify-activity\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "No activity changes in this PR; nothing to verify."
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.changes.outputs.relevant != 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        if: steps.changes.outputs.relevant != 'false'
        run: npm ci

      - name: Verify Activity (typecheck, build, Storybook, Playwright)
        if: steps.changes.outputs.relevant != 'false'
        run: ./scripts/verify-activity.sh
