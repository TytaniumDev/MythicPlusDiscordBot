name: Migrate Secrets to Doppler
on:
  workflow_dispatch: # Manual trigger only

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Push secrets to Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          # Bot secrets
          doppler secrets set \
            BOT_TOKEN="${BOT_TOKEN}" \
            DISCORD_APPLICATION_ID="${DISCORD_APPLICATION_ID}" \
            FIREBASE_CREDENTIALS_JSON="${FIREBASE_CREDENTIALS_JSON}" \
            DEVELOPER_ID="${DEVELOPER_ID}" \
            GITHUB_TOKEN="${GH_ISSUE_TOKEN}" \
            ACTIVITY_URL="${ACTIVITY_URL}" \
            SENTRY_DSN="${SENTRY_DSN}" \
            --no-interactive

          # Firebase/Vite secrets (for frontend)
          doppler secrets set \
            VITE_FIREBASE_API_KEY="${VITE_FIREBASE_API_KEY}" \
            VITE_FIREBASE_AUTH_DOMAIN="${VITE_FIREBASE_AUTH_DOMAIN}" \
            VITE_FIREBASE_PROJECT_ID="${VITE_FIREBASE_PROJECT_ID}" \
            VITE_FIREBASE_STORAGE_BUCKET="${VITE_FIREBASE_STORAGE_BUCKET}" \
            VITE_FIREBASE_MESSAGING_SENDER_ID="${VITE_FIREBASE_MESSAGING_SENDER_ID}" \
            VITE_FIREBASE_APP_ID="${VITE_FIREBASE_APP_ID}" \
            --no-interactive

          # Deploy secrets
          doppler secrets set \
            PI_HOST="${PI_HOST}" \
            PI_USER="${PI_USER}" \
            PI_APP_DIR="${PI_APP_DIR}" \
            GHCR_TOKEN="${GHCR_TOKEN}" \
            --no-interactive

          echo "Migration complete. Verify with: doppler secrets --only-names"
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          GH_ISSUE_TOKEN: ${{ secrets.GH_ISSUE_TOKEN }}
          ACTIVITY_URL: https://tytaniumdev.github.io/MythicPlusDiscordBot/
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
          PI_APP_DIR: ${{ secrets.PI_APP_DIR }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
