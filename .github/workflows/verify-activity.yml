name: Verify Activity

on:
  pull_request:
    paths:
      - 'activity/**'
      - 'packages/shared/**'
      - 'scripts/verify-activity.sh'
      - 'scripts/playwright-docker.sh'
      - '.github/workflows/verify-activity.yml'
  workflow_dispatch:

jobs:
  verify-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Activity (typecheck, build, Storybook, Playwright)
        run: ./scripts/verify-activity.sh --update-and-verify

      - name: Fail if snapshots are outdated
        run: |
          if ! git diff --quiet activity/tests/__screenshots__/; then
            echo "::error::Visual test snapshots are outdated. Run locally and commit the results:"
            echo "::error::  ./scripts/playwright-docker.sh --update-snapshots"
            echo ""
            echo "Changed snapshots:"
            git diff --name-only activity/tests/__screenshots__/
            exit 1
          fi
          echo "All snapshots are up-to-date."
