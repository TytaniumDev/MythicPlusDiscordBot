name: CI and Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        run: echo "IMAGE_NAME=$(echo ghcr.io/${GITHUB_REPOSITORY} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to Raspberry Pi
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          port: ${{ secrets.PI_SSH_PORT || 22 }}
          script: |
            set -e
            IMAGE_NAME=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')
            IMAGE_TAG=${{ github.sha }}
            docker login ghcr.io -u ${{ github.repository_owner }} -p ${{ secrets.GHCR_TOKEN }}
            export BOT_TOKEN="${{ secrets.BOT_TOKEN }}"
            export DISCORD_APPLICATION_ID="${{ secrets.DISCORD_APPLICATION_ID }}"
            cd ${{ secrets.PI_APP_DIR }}
            export IMAGE_NAME
            export IMAGE_TAG
            docker compose pull
            docker compose up -d --remove-orphans
            container_id=$(docker compose ps -q bot)
            if [ -z "$container_id" ]; then
              echo "Bot container not found."
              exit 1
            fi
            for i in $(seq 1 12); do
              health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")
              status=$(docker inspect -f '{{.State.Status}}' "$container_id")
              if [ "$health" = "healthy" ] || { [ "$health" = "none" ] && [ "$status" = "running" ]; }; then
                echo "Container healthy/running."
                break
              fi
              if [ "$health" = "unhealthy" ] || [ "$status" != "running" ]; then
                echo "Container unhealthy or stopped."
                break
              fi
              sleep 5
            done
            if [ "$health" = "unhealthy" ] || [ "$status" != "running" ]; then
              echo "Restarting bot container..."
              docker compose restart bot
              sleep 5
              container_id=$(docker compose ps -q bot)
              health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")
              status=$(docker inspect -f '{{.State.Status}}' "$container_id")
              if [ "$health" = "unhealthy" ] || [ "$status" != "running" ]; then
                echo "Container still unhealthy or stopped."
                exit 1
              fi
            fi
            docker image prune -f

      - name: Notify Discord
        if: always() && secrets.DEPLOY_WEBHOOK_URL != ''
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          payload=$(python - <<'PY'
import json
import os

status = os.environ["DEPLOY_STATUS"]
repo = os.environ["GITHUB_REPOSITORY"]
ref = os.environ["GITHUB_REF"]
sha = os.environ["GITHUB_SHA"][:7]
message = f"Deploy {status} for {repo} ({ref} @ {sha})"
print(json.dumps({"content": message}))
PY
)
          curl -sS -H "Content-Type: application/json" -d "$payload" "$DEPLOY_WEBHOOK_URL"
